<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#100d19">
<meta name="description" content="Baba Zuva, My Forever — a birthday song dedicated to Bryan by May.">
<title>Baba Zuva, My Forever | WarStreet Memories</title>

<style>
:root {
  --bg: #100d19;
  --card: #1d1728;
  --pink: #f1b9d5;
  --purple: #b7a3ff;
  --text: #fff9ff;
  --muted: #b9b2c8;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100svh;
  padding: 28px 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text);
  background:
    radial-gradient(ellipse at 15% 10%, rgba(151,92,194,.18), transparent 45%),
    radial-gradient(ellipse at 90% 75%, rgba(224,119,176,.12), transparent 42%),
    var(--bg);
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

main {
  width: 100%;
  max-width: 420px;
  margin: auto;
}

.photo-frame {
  overflow: hidden;
  padding: 6px;
  border-radius: 23px;
  background: linear-gradient(145deg, #40304f, #1b1627, #503046);
  border: 1px solid rgba(255,255,255,.13);
  box-shadow: 0 18px 50px rgba(0,0,0,.35);
}

.photo-frame img {
  display: block;
  width: 100%;
  height: auto;
  max-height: 60svh;
  object-fit: contain;
  object-position: center;
  border-radius: 17px;
  background: #181421;
}

.dedication {
  margin: 22px 0 25px;
  text-align: center;
}

.dedication h1 {
  margin: 0 0 9px;
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(27px, 7vw, 35px);
  line-height: 1.2;
  font-weight: 400;
  color: var(--pink);
}

.dedication p {
  margin: 0;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.7;
}

.player {
  padding: 17px;
  border: 1px solid rgba(255,255,255,.10);
  border-radius: 20px;
  background: linear-gradient(145deg, rgba(40,34,59,.95), rgba(26,22,39,.98));
  box-shadow: 0 15px 38px rgba(0,0,0,.2);
}

.player-top {
  display: flex;
  align-items: center;
  gap: 13px;
}

.album-art {
  flex: 0 0 48px;
  width: 48px;
  height: 48px;
  display: grid;
  place-items: center;
  border-radius: 14px;
  color: var(--pink);
  font-size: 23px;
  background: linear-gradient(135deg, #694c80, #302a51 70%, #39243e);
}

.track-info {
  flex: 1;
  min-width: 0;
}

.track-name {
  margin: 0 0 5px;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 16px;
  line-height: 1.35;
}

.track-subtitle {
  margin: 0;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.5;
}

.play-button {
  flex: 0 0 49px;
  width: 49px;
  height: 49px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 50%;
  color: #21172a;
  background: linear-gradient(145deg, #f6d2e5, #b9a6ff);
  font-size: 19px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.play-button:active {
  transform: scale(.95);
}

.play-button:focus-visible {
  outline: 2px solid white;
  outline-offset: 4px;
}

.progress-track {
  height: 4px;
  margin-top: 18px;
  overflow: hidden;
  border-radius: 8px;
  background: rgba(255,255,255,.12);
}

.progress-fill {
  width: 0;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--purple), var(--pink));
}

.player-meta {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  margin-top: 9px;
  color: var(--muted);
  font-size: 10px;
  font-variant-numeric: tabular-nums;
}

#player-state {
  text-align: center;
}

.footer {
  margin: 25px 0 0;
  color: #a89bb6;
  font-size: 9px;
  letter-spacing: 2px;
  text-align: center;
}

@media (max-width: 350px) {
  body {
    padding: 18px 12px;
  }

  .player {
    padding: 13px;
  }

  .track-name {
    font-size: 14px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>

<body>
<main>
  <figure class="photo-frame">
    <img
      src="https://pub-e10a28ca38cf452da437555e0f90e288.r2.dev/warstreetmemories/2026%20Memories/Birthdays/May%20to%20Bryan/bryan_01.webp"
      alt="A special memory of Bryan and May"
      fetchpriority="high"
    >
  </figure>

  <header class="dedication">
    <h1>Baba Zuva, My Forever</h1>
    <p>
      A birthday song for Bryan, with all my love.<br>
      <span>— May Tita ❤️</span>
    </p>
  </header>

  <section class="player" aria-label="Birthday song player">
    <div class="player-top">
      <div class="album-art" aria-hidden="true">♫</div>

      <div class="track-info">
        <p class="track-name">Baba Zuva, My Forever</p>
        <p class="track-subtitle" id="track-subtitle">
          A song made just for you
        </p>
      </div>

      <button
        class="play-button"
        id="play-button"
        type="button"
        aria-label="Play song"
      >▶</button>
    </div>

    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>

    <div class="player-meta">
      <span id="current-time">0:00</span>
      <span id="player-state" aria-live="polite">Ready to play</span>
      <span id="duration">0:00</span>
    </div>
  </section>

  <!-- Audio file is stored beside index.html in the repository root. -->
  <audio id="birthday-song" preload="metadata">
    <source
      src="./Baba%20Zuva%2C%20My%20Forever%20%F0%9F%92%97.m4a"
      type="audio/mp4"
    >
  </audio>

  <p class="footer">WARSTREET MEMORIES</p>
</main>

<script>
(() => {
  const song = document.getElementById("birthday-song");
  const playButton = document.getElementById("play-button");
  const playerState = document.getElementById("player-state");
  const trackSubtitle = document.getElementById("track-subtitle");
  const currentTime = document.getElementById("current-time");
  const duration = document.getElementById("duration");
  const progressFill = document.getElementById("progress-fill");

  let loading = false;

  function formatTime(value) {
    if (!Number.isFinite(value) || value < 0) return "0:00";

    const minutes = Math.floor(value / 60);
    const seconds = Math.floor(value % 60);

    return `${minutes}:${String(seconds).padStart(2, "0")}`;
  }

  playButton.addEventListener("click", async () => {
    if (loading) return;

    if (!song.paused) {
      song.pause();
      return;
    }

    loading = true;
    playButton.disabled = true;
    playerState.textContent = "Loading song…";

    try {
      await song.play();
    } catch (error) {
      console.error("Audio playback error:", error);
      playerState.textContent = "Playback failed";
      trackSubtitle.textContent =
        "Check the audio filename and try again.";
    } finally {
      loading = false;
      playButton.disabled = false;
    }
  });

  song.addEventListener("play", () => {
    playButton.textContent = "Ⅱ";
    playButton.setAttribute("aria-label", "Pause song");
    playerState.textContent = "Now playing";
    trackSubtitle.textContent = "Playing with love ❤️";
  });

  song.addEventListener("pause", () => {
    playButton.textContent = "▶";
    playButton.setAttribute("aria-label", "Play song");

    if (!song.ended) {
      playerState.textContent = "Paused";
    }
  });

  song.addEventListener("loadedmetadata", () => {
    duration.textContent = formatTime(song.duration);
  });

  song.addEventListener("timeupdate", () => {
    currentTime.textContent = formatTime(song.currentTime);

    const percentage =
      Number.isFinite(song.duration) && song.duration > 0
        ? (song.currentTime / song.duration) * 100
        : 0;

    progressFill.style.width = `${percentage}%`;
  });

  song.addEventListener("ended", () => {
    playButton.textContent = "▶";
    playButton.setAttribute("aria-label", "Replay song");
    playerState.textContent = "Finished";
    trackSubtitle.textContent = "Made just for you, Bryan ❤️";
    progressFill.style.width = "0%";
    currentTime.textContent = "0:00";
  });

  song.addEventListener("error", () => {
    playerState.textContent = "Could not load audio";
    trackSubtitle.textContent =
      "Verify the exact filename and deployed file path.";
    console.error("Audio error details:", song.error);
  });

  song.addEventListener("waiting", () => {
    playerState.textContent = "Buffering…";
  });

  song.addEventListener("playing", () => {
    playerState.textContent = "Now playing";
  });

  song.addEventListener("canplay", () => {
    if (song.paused && !song.error) {
      playerState.textContent = "Ready to play";
    }
  });
})();
</script>
</body>
</html>
